<meta charset="utf-8"><h3><span>How the receiver is chosen</span></h3><p><span>The rule checks the party role first:</span></p><p><span></span></p><div><span>IF(</span><br></div><div><span>  Party_Role:Code = "CN",</span><br></div><div><span>  F_OrderReceiver(</span><br></div><div><span>    &lt;OrderParty&gt;:sequence:Order</span><br></div><div><span>  )</span><br></div><div><span>)</span></div><p></p><p><span>Then call it from the mapping:</span></p><p><span></span></p><div><span>map(Order) -&gt; Receiver</span></div><p></p><p><span>That is all you need.</span></p>
