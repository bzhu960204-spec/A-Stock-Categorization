<p>A quadratic <span data-latex="ax^2+bx+c=0" data-type="inline-math"></span> with <span data-latex="a\neq 0" data-type="inline-math"></span> has the roots</p>
<div data-latex="x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}" data-type="block-math"></div>
<p>The sign of the discriminant decides how many real roots there are.</p>
