spring.application.name=stock-classifier
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/stockdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# CORS
app.cors.allowed-origins=http://localhost:5173

# DevTools - Hot Reload
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=1000
spring.devtools.restart.quiet-period=400

# Large request body (for base64 images in documents)
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=-1
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# External API Keys (override via environment variables)
app.twelvedata.api-key=${TWELVEDATA_API_KEY:a50ca4ed0adf4b5eb10a9ffca9f14fea}
app.eastmoney.token=${EASTMONEY_TOKEN:D43BF722C8E33BDC906FB84D85E326E8}

