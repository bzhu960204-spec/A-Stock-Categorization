spring.application.name=stock-classifier
server.port=8080
# Bind to loopback only so the app (no auth) is not reachable from the LAN.
# Set SERVER_ADDRESS=0.0.0.0 (or start with -Lan) to expose it deliberately.
server.address=${SERVER_ADDRESS:127.0.0.1}

# Load secrets from the repo-root .env (working dir is backend/ for dev and prod; ./ covers IDE runs from the root).
# Real environment variables take precedence over values in .env.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/stockdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks that entities match it.
# Changing an entity therefore requires a new V<n>__*.sql migration, otherwise startup fails fast.
spring.jpa.hibernate.ddl-auto=validate
# Databases created before Flyway was introduced are marked as V1 without running V1__baseline.sql.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema created by Hibernate ddl-auto=update
# H2 web console is a full SQL shell; only the "dev" profile enables it (see application-dev.properties).
spring.h2.console.enabled=false

# CORS (dev profile only, see CorsConfig): comma-separated origin patterns
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

# DevTools - Hot Reload
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=1000
spring.devtools.restart.quiet-period=400

# Request size limits (S6). Editors upload pasted images to /api/images instead of embedding base64,
# so JSON bodies only carry text: non-multipart bodies over app.request.max-body-size get 413 (RequestSizeLimitFilter).
# Multipart uploads (images, Idea attachments) are capped per file / per request below.
app.request.max-body-size=10MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# External API Keys — no defaults in code; provide them via .env or environment variables (see .env.example).
# The Twelve Data key can also be saved from the UI (stored in the DB, takes precedence).
app.twelvedata.api-key=${TWELVEDATA_API_KEY:}
app.eastmoney.token=${EASTMONEY_TOKEN:}


# Database backups (H2 "BACKUP TO", online & consistent). Auto-runs when the newest backup is older than
# interval-hours (checked hourly); keeps the newest N zips. Restore: stop the app, unzip into ./data.
app.backup.enabled=true
app.backup.dir=./data/backups
app.backup.keep=14
app.backup.interval-hours=24